# Central configuration for the handwriting-ai pipeline.
# All modules read tunable parameters from here instead of hard-coding them.

preprocessing:
  target_line_height: 400          # image is upscaled so the text line is this tall (px) before processing
  adaptive_thresh_block_size: 35
  adaptive_thresh_C: 11
  deskew_angle_search_deg: 15       # deskew searches this range, +/- degrees (larger tilts are not corrected)
  deskew_angle_step_deg: 0.25       # search resolution
  deskew_min_chars: 8               # fewer characters than this -> deskew is skipped (angle 0.0): a short word does not
                                     # determine a baseline angle. Uses the label length, or the component count if unknown.
  median_filter_kernel: 3

segmentation:
  min_component_area: 20            # px^2, filters out noise specks
  merge_gap_px: 4                   # stacked components may overlap vertically by at most this many px and still merge
  stack_min_x_overlap: 0.25         # ...and must overlap in x by >= this fraction of the narrower box (dot over stem; the
                                     # slanted "i" in data/samples/quick_sample.png has 0.41, so 0.5 would miss it)
  stack_max_gap_ratio: 0.6          # ...and be separated vertically by <= this fraction of the taller box's height
  split_touching_glyphs: true       # detect over-wide connected components (touching/cursive-joined
                                     # letters) and split them at projection-profile valleys
  wide_component_width_ratio: 1.6   # a component wider than this * expected char width is treated as touching glyphs
  min_split_segment_px: 6           # minimum width (px) for a split-off sub-glyph, else the split is discarded

recognition:
  # Recognition backend is pluggable (see src/recognition/base.py).
  # "labeled" = user supplies ground-truth text for the sample (most reliable when correct).
  # "template" = nearest-neighbour template matching baseline.
  # "cnn" = trained CharCNN classifier (src/recognition/cnn_recognizer.py) — actually looks at
  #   the pixels; used both as a selectable backend and as an always-on cross-check in the app.
  backend: "labeled"
  cnn_checkpoint_path: "models/checkpoints/char_cnn.pt"

recognition_training:
  # Training config for the CNN recognizer (scripts/train_cnn_recognizer.py),
  # analogous to `training:` below but for the classifier, not the style VAE.
  batch_size: 128
  epochs: 10
  lr: 0.001
  val_fraction: 0.05
  seed: 42
  max_train_samples: 20000          # cap for CPU-feasible training time; raise for a better final run
  augment: true                     # random affine + erosion/dilation + noise, for robustness to
                                     # slanted, variable-stroke-width, cursive-influenced letterforms
  checkpoint_path: "models/checkpoints/char_cnn.pt"

style_encoder:
  latent_dim: 32
  content_embed_dim: 16
  image_size: 28                    # matches EMNIST
  num_classes: 26                   # lowercase a-z

training:
  batch_size: 32
  epochs: 6
  lr: 0.001
  val_fraction: 0.05
  seed: 42
  max_train_samples: 6000           # cap for CPU-feasible training time / this dev machine is currently very low on free RAM
  checkpoint_path: "models/checkpoints/style_vae.pt"

generation:
  variants_per_char: 3
  jitter_rotation_deg: 1.5

# Typographic priors (in x-heights), used ONLY where a bitmap has no absolute size: the VAE's 28x28 output
# (EMNIST fills the box for every letter) and samples with no x-height-only letter to measure. See src/generator/glyph.py.
glyph_metrics:
  ascender_ratio: 2.0               # total height of b d f h k l
  t_ratio: 1.5                      # total height of t
  dotted_ratio: 1.8                 # total height of i (stem + dot); j = this + descender depth
  descender_depth_ratio: 0.8        # how far g j p q y drop below the baseline
  spacing_max_ratio: 1.0            # cap on the writer's measured inter-glyph gap

renderer:
  target_x_height_px: 40            # every glyph is scaled so its x-height equals this (common x-height, not common box)
  char_spacing_px: 2                # extra tracking added to each glyph's advance_width (which already carries the writer's spacing)
  word_spacing_px: 22
  line_height_multiplier: 1.6
  baseline_jitter_px: 2
  rotation_jitter_deg: 1.0
  canvas_margin_px: 40

# Real handwriting data (IAM Handwriting Database). See src/data/iam.py.
# The dataset itself is licensed and NOT in the repo: place it under `root`:
#   <root>/ascii/{forms,lines,words}.txt
#   <root>/lines/<a01>/<a01-000u>/<a01-000u-00>.png
#   <root>/words/<a01>/<a01-000u>/<a01-000u-00-00>.png
data:
  iam:
    root: "data/iam"
    split_source: "vatr"             # CANONICAL: the IAM writer split of HWT/VATr (fixed files, see scripts/make_vatr_split.py)
                                     # "seeded" = FALLBACK ONLY (self-made split below); do not use for reported results
    splits_dir: "data/splits/vatr"   # canonical writer-ID lists (train/val/test JSON, committed, auditable)
    seeded_splits_dir: "data/splits/seeded"   # FALLBACK-ONLY seeded split, kept (not deleted) for reference/tests
    split_seed: 1337                 # fallback only: the seeded split is a pure function of this seed + forms.txt
    split_fractions:                 # fractions of WRITERS (not samples); must sum to 1
      train: 0.8
      val: 0.1
      test: 0.1
    image_height: 64                 # IAMDataset[i] images are resized to this height, width scales, aspect kept

# Evaluation harness (scripts/evaluate.py, src/evaluation/harness.py).
evaluation:
  results_dir: "results"            # each run -> results/<utc-timestamp>_<git-sha>/metrics.json, plus results/index.csv
  writer_embedder: "trained"        # "trained" = the writer-ID ResNet (scripts/train_writer_id.py); "stub" = rule-based
                                    # PLACEHOLDER for smoke tests only. "trained" never falls back to the stub silently.
  writer_id_run: "models/checkpoints/writerid_20260921T180911Z_ed897d02_cpu_r1"   # PINNED (GATE 1 instrument); change only with a logged re-score of all rows
  crnn_run: "models/checkpoints/crnn_20260922T003942Z_d1f87b49_cpu_r1"            # PINNED (GATE 1 instrument); null would mean newest-by-name wins
  protocol:                         # ROADMAP 1.4 protocol (scripts/evaluate.py --mode protocol), see src/evaluation/protocol.py
    split: "test"                   # evaluated on TEST writers only (needs --allow-test)
    n_writers: 20                   # fixed seeded subset of test writers (CPU budget; labelled "subset" in results)
    targets_per_writer: 10          # held-out lines per writer that are generated and scored
    ks: [1, 5]                      # numbers of reference lines
    seed: 1337
  targets_per_writer: 2             # per writer: 1 reference line conditions the generator, this many other lines are targets
  max_target_chars: 40              # target text is truncated to this many characters (letters and spaces only)
  min_reference_letters: 12         # a line must have at least this many letters to be used as reference/target
  smoke_texts: ["the quick fox", "hello world"]   # --smoke only: text rendered for data/samples/*_sample.png

# Writer-ID model (src/writer_id/, scripts/train_writer_id.py): a metric-usable embedding of *who wrote it*, trained
# from scratch on IAM train-split writers and evaluated on unseen TEST writers. Used for the style-fidelity metric.
writer_id:
  cache_dir: "data/processed/iam_writer_cache"   # decoded, binarised, height-normalised line crops (uint8 .npy)
  input_height: 64                  # crops are resized to this height, width scales (aspect preserved)
  binarize: true                    # Otsu-binarise at native resolution before resizing. The metric compares BINARY renders
                                     # (generated text vs reference), so the model is trained in that domain.
  window_width: [160, 256]          # training: per batch, one width drawn from this range; each crop is a random window
  model:
    widths: [32, 64, 128, 256]      # stage widths of the ResNet; the last one is the embedding size (GAP output)
    blocks: [2, 2, 2, 2]            # BasicBlocks per stage
    stem_stride: 2
  loss:
    ntxent_weight: 1.0              # total = cross_entropy + ntxent_weight * NT-Xent
    temperature: 0.1
  train:
    writers_per_batch: 16           # batch = writers_per_batch x crops_per_writer (crops of the same writer are the positives)
    crops_per_writer: 4
    epochs: 10                      # ROADMAP cap 40, /4 because CUDA is unavailable (CPU-reduced)
    early_stop_patience: 3          # stop after this many epochs without a val top-1/mAP improvement
    steps_per_epoch: null           # null -> ceil(num_train_lines / batch_size)
    lr: 0.002
    weight_decay: 0.0001
    seed: 1337
    num_threads: 4
  augment:                          # affine + elastic ONLY. No shear/slant and no stroke-width change: those are the style signal.
    rotation_deg: 1.0
    scale: 0.05
    translate_px: 3
    elastic_prob: 0.5
    elastic_alpha: 2.5              # displacement magnitude, px
    elastic_sigma: 6.0              # smoothness of the displacement field, px
  eval:
    mode: "window_mean"             # "window_mean" (mean of window embeddings; matches training) | "full_line"
    window_width: 224
    window_stride: 112
    max_windows: 32
    max_line_width: 2048            # full_line mode: centre-crop lines wider than this
    exclude_same_form: true         # gallery excludes lines from the query's own form (page): pen, paper and scan are shared
    min_usable_top1: 0.6            # below this, the embedding is NOT a usable writer-identity metric
  calibration:
    n_crops: 200                    # scripts/calibrate_legibility.py: real held-out crops scored by the CNN legibility scorer
    seed: 1337

# CRNN-CTC line recognizer = the LEGIBILITY INSTRUMENT (src/recognition/crnn.py, scripts/train_crnn.py). Trained on
# train-split writers only, frozen afterwards; CER/WER of generated lines under it is the legibility score.
crnn:
  input_height: 64                  # same canonical crops as the writer-ID net (ink high, Otsu-binarised, area-resized)
  hidden: 256                       # LSTM hidden size per direction (2 layers, bidirectional)
  batch_size: 16
  epochs: 15                        # ROADMAP cap 60, /4 because CUDA is unavailable (CPU-reduced)
  early_stop_patience: 3            # epochs without a val-CER improvement
  lr: 0.001
  weight_decay: 0.0001
  width_jitter: 0.1                 # training aug: horizontal rescale by a factor in [1-x, 1+x] (no slant/stroke change)
  max_line_width: 1400              # training/eval crops wider than this are skipped for speed (few lines, CPU budget)
  num_threads: 4
  seed: 1337

vatr:                               # Stage 3 backend (src/generator/vatr_backend.py); official repo, unedited
  root: "third_party/VATr"          # aimagelab/VATr @ 183501e (gitignored clone)
  checkpoint: "files/vatr.pth"      # released checkpoint, relative to root
